<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rusty Warfare</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<section id="login" class="screen photo login-photo"><div class="hotspot login-user" data-action="focus-user"></div><div class="hotspot login-pass" data-action="focus-pass"></div><button class="photo-btn sign" data-action="login">Sign In</button><button class="photo-btn create" data-action="create">Create Account</button><button class="photo-btn guest" data-action="guest">PLAY AS GUEST</button></section>
<section id="create" class="screen photo create-photo hidden"><input id="newUser" class="create-input user" placeholder="Username"><input id="newPass" class="create-input pass" type="password" placeholder="Password"><button class="photo-btn create-submit" data-action="create-submit">Create Account</button><button class="photo-btn back" data-action="back-login">Back</button></section>
<section id="home" class="screen photo home-photo hidden"><button class="photo-btn home-play" data-action="play">PLAY</button><button class="photo-btn home-servers" data-action="servers">SERVERS</button><button class="photo-btn home-settings" data-action="settings">SETTINGS</button><button class="photo-btn home-quit" data-action="quit">QUIT</button></section>
<section id="servers" class="screen panel-screen hidden"><div class="panel"><h1>RUSTY WARFARE — SERVERS</h1><div class="server-row"><span>COASTAL OUTPOST</span><span>ONLINE</span><button data-action="play">JOIN</button></div><div class="server-row"><span>SCRAP CONTAINER</span><span>ONLINE</span><button data-action="play">JOIN</button></div><button data-action="home">BACK</button></div></section>
<section id="game" class="screen game hidden"><canvas id="world"></canvas><div class="hud"><div class="topbar"><b>RUSTY WARFARE</b><span id="status">SURVIVAL • ISLAND</span><button data-action="map">MAP</button><button data-action="inventory">INVENTORY</button></div><div class="crosshair">+</div><div class="bottom"><span id="coords">X 0 Z 0</span><span id="selected">Selected: Rock</span><button data-action="home">MENU</button></div></div><div id="inventory" class="inventory hidden"><h2>INVENTORY</h2><div id="slots"></div><p>Picking up an item never changes your selected slot.</p><button data-action="inventory">CLOSE</button></div><div id="mapOverlay" class="map-overlay hidden"><img src="assets/map.jpg"><button data-action="map">CLOSE MAP</button><div class="map-player">YOU</div></div></section>
<section id="settings" class="screen panel-screen hidden"><div class="panel"><h1>SETTINGS</h1><label>Mouse sensitivity <input id="sens" type="range" min="1" max="20" value="10"></label><label>Graphics <select><option>High</option><option>Medium</option><option>Low</option></select></label><button data-action="home">BACK</button></div></section>
</div><script src="app.js"></script></body></html>
